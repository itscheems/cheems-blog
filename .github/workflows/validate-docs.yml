name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Require merge commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy="$(gh api graphql \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed } }' \
            --jq '.data.repository | .mergeCommitAllowed and (.squashMergeAllowed | not) and (.rebaseMergeAllowed | not)')"
          test "$policy" = true

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

      - name: Build documentation
        run: npm run docs:build
